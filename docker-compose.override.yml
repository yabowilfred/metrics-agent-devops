# Chargé automatiquement avec docker-compose.yaml : mode développement
services:
  api:
    image: metrics-agent:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    entrypoint: []
    command: ["uvicorn", "app.api:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ./app:/app/app
  agent:
    image: metrics-agent:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    entrypoint: []
    command: ["python", "-m", "app.agent"]
    volumes:
      - ./app:/app/app
